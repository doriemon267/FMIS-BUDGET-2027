<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Client</title>
</head>
<body>
    <h1>Debug Client - Local Storage Check</h1>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        // Check localStorage
        output.innerHTML += '<h2>Local Storage Contents:</h2>';
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const value = localStorage.getItem(key);
            output.innerHTML += `<p><strong>${key}:</strong> ${value}</p>`;
        }
        
        // Test API call
        output.innerHTML += '<h2>Testing API Call:</h2>';
        
        const token = localStorage.getItem('accessToken') || localStorage.getItem('token');
        const activeRegion = localStorage.getItem('activeRegion');
        
        output.innerHTML += `<p><strong>Token found:</strong> ${token ? 'YES' : 'NO'}</p>`;
        output.innerHTML += `<p><strong>Active Region:</strong> ${activeRegion || 'NONE'}</p>`;
        
        if (token) {
            fetch('http://localhost:5005/api/employee-list', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                output.innerHTML += `<p><strong>API Response Status:</strong> ${response.status}</p>`;
                return response.json();
            })
            .then(data => {
                output.innerHTML += `<p><strong>API Response:</strong> ${JSON.stringify(data, null, 2)}</p>`;
            })
            .catch(error => {
                output.innerHTML += `<p><strong>API Error:</strong> ${error.message}</p>`;
            });
        } else {
            output.innerHTML += '<p><strong>Cannot test API:</strong> No token found</p>';
        }
    </script>
</body>
</html>
